# =============================================================================
# GitHub Actions workflow: runs the collector automatically every weekday.
#
# PUT THIS AT:  .github/workflows/collect_options.yml
# (the folder path matters, GitHub only looks there)
#
# You do NOT need your computer on. GitHub runs it on their machines, for free
# on public repositories, and commits the data back to your repo.
#
# TIMING: 13:00 UTC is 8am or 9am New York depending on daylight saving, so
# it always lands before the US open. Open interest published overnight by the
# OCC reflects the PREVIOUS session, so this captures yesterday's settled
# positioning alongside a clean pre-open spot price.
# =============================================================================

name: Collect options chains

on:
  schedule:
    - cron: "0 13 * * 1-5"     # 13:00 UTC, Monday to Friday
  workflow_dispatch:           # also lets you trigger it by hand from the
                               # Actions tab, which you want for the first run

permissions:
  contents: write              # required so the job can commit the data back

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run the collector
        run: python collect.py

      - name: Commit the snapshot
        run: |
          git config user.name  "options-collector"
          git config user.email "actions@github.com"
          git add data
          # "git commit" fails if nothing changed, e.g. a US market holiday.
          # That is normal, so swallow it rather than failing the whole run.
          git diff --staged --quiet || git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
          git push
